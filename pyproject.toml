[project]
name = "speedbench"
version = "0.1.0"
description = "Auditable end-to-end browser-agent navigation benchmark"
requires-python = ">=3.13"
dependencies = ["websocket-client==1.9.0", "python-dotenv==1.2.1"]

[project.scripts]
speedbench = "speedbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speedbench"]
